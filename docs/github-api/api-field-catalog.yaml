  - logical_field: github_pr.closed_at
    source: GraphQL
    path: PullRequest.closedAt
    type: DateTime
    nullable: true
    canonical_field: pr.closed_at
    pii: no
  - logical_field: github_pr.merged_at
    source: GraphQL
    path: PullRequest.mergedAt
    type: DateTime
    nullable: true
    canonical_field: pr.merged_at
    pii: no
  - logical_field: github_pr.state
    source: GraphQL
    path: PullRequest.state
    type: PullRequestState!
    nullable: false
    canonical_field: pr.state
    pii: no
  - logical_field: github_pr.is_draft
    source: GraphQL
    path: PullRequest.isDraft
    type: Boolean!
    nullable: false
    canonical_field: pr.is_draft
    pii: no
  - logical_field: github_pr.additions
    source: GraphQL
    path: PullRequest.additions
    type: Int!
    nullable: false
    canonical_field: pr.additions
    pii: no
  - logical_field: github_pr.deletions
    source: GraphQL
    path: PullRequest.deletions
    type: Int!
    nullable: false
    canonical_field: pr.deletions
    pii: no
  - logical_field: github_pr.changed_files
