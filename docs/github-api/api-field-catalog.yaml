  - logical_field: github_pr.author
    source: GraphQL
    path: PullRequest.author
    type: Actor
    nullable: true
    canonical_field: actor.*
    pii: yes-indirect
  - logical_field: github_pr.created_at
    source: GraphQL
    path: PullRequest.createdAt
    type: DateTime!
    nullable: false
    canonical_field: pr.created_at
