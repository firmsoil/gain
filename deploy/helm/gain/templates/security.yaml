{{- if and .Values.mcpServer.enabled .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "gain.fullname" . }}-mcp-pdb
  labels:
    {{- include "gain.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-server
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "gain.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mcp-server
{{- end }}
---
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "gain.fullname" . }}-netpol
  labels:
    {{- include "gain.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "gain.selectorLabels" . }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.mcpServer.port }}
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow HTTPS egress to external and configured enterprise CIDRs
    {{- if .Values.networkPolicy.egress.allowedCIDRs }}
    {{- range .Values.networkPolicy.egress.allowedCIDRs }}
    - to:
        - ipBlock:
            cidr: {{ . }}
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
    {{- else }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
{{- end }}
