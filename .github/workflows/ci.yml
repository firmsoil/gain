name: GAIN Enterprise CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read
  security-events: write
  pull-requests: write

jobs:
  lint-and-types:
    name: Code Quality & Strict Typing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Create virtualenv and install dependencies
        run: |
          uv venv --python 3.12
          uv pip install -e '.[dev]'

      - name: Run Ruff Lint Check
        run: uv run ruff check src tests

      - name: Run Ruff Format Check
        run: uv run ruff format --check src tests

      - name: Run Mypy Strict Type Check
        run: uv run mypy src tests --strict

  test-matrix:
    name: Unit & Integration Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint-and-types
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e '.[dev]'

      - name: Run Pytest Suite with Coverage
        run: |
          uv run pytest --cov=gain --cov-report=term --cov-report=xml

  supply-chain-security:
    name: Supply-Chain & Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Audit Dependencies with pip-audit
        run: |
          uv venv --python 3.12
          uv pip install pip-audit
          uv run pip-audit --strict .

  se3-quality-gate:
    name: SE 3.0 Deterministic Quality Gate
    runs-on: ubuntu-latest
    needs: lint-and-types
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          uv venv --python 3.12
          uv pip install -e '.[dev]'

      - name: Run GAIN Scan & Extract Telemetry
        run: |
          mkdir -p reports
          uv run python -m gain.cli scan . --format json > reports/gain_scorecard.json
          uv run python -m gain.cli scan . --format markdown > reports/gain_scorecard.md

      - name: Evaluate Deterministic Quality Gate
        run: |
          uv run python scripts/evaluate_quality_gate.py --input reports/gain_scorecard.json

      - name: Post Scorecard Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('reports/gain_scorecard.md')) {
              const body = fs.readFileSync('reports/gain_scorecard.md', 'utf8');
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `### 🛡️ GAIN AI-Native SE 3.0 Deterministic Quality Gate\n\n${body}`
              });
            }

      - name: Upload Telemetry Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gain-se3-scorecard
          path: reports/

  container-build:
    name: Container Build & Health Validation
    runs-on: ubuntu-latest
    needs: [test-matrix, supply-chain-security, se3-quality-gate]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build GAIN Production Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: gain:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Container Help Entrypoint
        run: docker run --rm gain:ci --help

      - name: Test Container Config Check
        run: docker run --rm -e GAIN_ENVIRONMENT=development -e GITHUB_TOKEN=ghp_ci_test_token_validation_only -e GAIN_GITHUB_REPOS=firmsoil/gain gain:ci config-check
